[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "micki"
version = "2.1.0"
description = "A modular, extensible, object-oriented microkinetic modeling package"
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Eric D. Hermes" },
    { name = "Aurora N. Janes" },
    { name = "J.R. Schmidt" },
]
requires-python = ">=3.12"
dependencies = [
    "ase",
    "numpy>=2.0",
    "sundials4py>=7.9,<8",
    "sympy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/jrschmidt2/micki"

[tool.setuptools]
packages = ["micki"]
