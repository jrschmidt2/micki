# Build, test and publish micki to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (no API token): the repository must be
# registered as a trusted publisher for the "micki" project on PyPI with
# workflow "publish.yml" and environment "pypi".
#
# The release tag must be "v" + the version in pyproject.toml (e.g. v2.0.0).

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml (expected v${version})"
            exit 1
          fi

      - name: Install and run the tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/micki/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
